#################### Plugins ####################

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# Style
# TokyoNight Moon
black="#222436"
bg="#222436"
bg_dark="#1E2030"
bg_highlight="#2F334D"
fg="#C8D3F5"
fg_dark="#828BB8"
comment="#636DA6"

blue="#82AAFF"
cyan="#86E1FC"
green="#C3E88D"
yellow="#FFC777"
orange="#FF966C"
red="#FF757F"
purple="#C099FF"

set -g status-position top
set -g status-justify centre
set -g status-left-length 100
set -g status-style "fg=${fg},bg=${bg_dark}"
set -g status-left "#[fg=${green},bold] #S #[fg=${fg},nobold] | "
set -g status-right " #{cpu}   #{mem}  󱛟 #{disk -f}  󱊣 #{battery} "
set -g window-status-current-format "#[fg=${cyan},bold]  #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format "#[fg=${fg_dark}] #I:#W"
set -g message-style "fg=${fg},bg=${bg_dark}"
set -g mode-style "fg=${bg},bg=${blue}"
set -g pane-border-style "fg=${comment}"
set -g pane-active-border-style "fg=${green}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/tpm/tpm'
